[package]
name = "kubo-ffi"
version = "975835.1839.124842"
edition = "2021"
description = "Safe Rust bindings to the Kubo C FFI layer"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gnostr-org/ipfs"

[features]
# Embeds the WebUI CAR (fetched by build.rs, see KUBO_FFI_SKIP_WEBUI_ASSET)
# and exposes kubo_ffi::web — a self-contained WebUI server.
web = []

[[example]]
name = "web"

[dependencies]

[build-dependencies]
# Core library has no heavy dependencies.

[dev-dependencies]
crossterm = "0.29"
ratatui = "0.30"















# build.rs invokes `go build` to produce libkubo_ffi.a
